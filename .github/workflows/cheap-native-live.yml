name: Cheap native live

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cheap-native-live
  cancel-in-progress: false

jobs:
  live:
    if: github.repository == 'smolpaws/openhands-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: LLM
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: native-haiku-5-5
            credential: CLAUDE_MAX_API_KEY
          - target: native-haiku-5-5-cache
            credential: CLAUDE_MAX_API_KEY
          - target: native-gpt-5-nano
            credential: OPENAI_API_KEY
          - target: native-deepseek-v4-1-flash
            credential: DEEPSEEK_API_KEY
          - target: regression-deepseek-accounting
            credential: DEEPSEEK_API_KEY
    steps:
      - name: Authorize manual run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const env = process.env;
          for (const actor of new Set([env.GITHUB_ACTOR, env.GITHUB_TRIGGERING_ACTOR].filter(Boolean))) {
            const response = await fetch(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/collaborators/${encodeURIComponent(actor)}/permission`, {
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            assert(response.ok, `Permission lookup returned HTTP ${response.status}`);
            assert(['admin', 'maintain', 'write'].includes((await response.json()).permission), 'Billable runs require repository write permission');
          }
          NODE
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run selected target with only its credential
        env:
          LIVE_KEY: ${{ secrets[matrix.credential] }}
          LIVE_KEY_NAME: ${{ matrix.credential }}
          LIVE_TARGET: ${{ matrix.target }}
          LLM_TEST_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const { LIVE_KEY, LIVE_KEY_NAME, LIVE_TARGET, ...env } = process.env;
          assert(LIVE_KEY, 'Selected credential is missing');
          const result = spawnSync(process.execPath, ['--import', 'tsx', 'scripts/live/run.ts', '--target', LIVE_TARGET], {
            env: { ...env, [LIVE_KEY_NAME]: LIVE_KEY }, stdio: 'inherit', timeout: 270_000,
          });
          process.exit(result.status ?? 1);
          NODE
      - name: Publish sanitized summary
        if: always()
        run: |
          if [ -f artifacts/llm/summary.md ]; then
            cat artifacts/llm/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cheap-live-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/llm/
          if-no-files-found: warn
          retention-days: 14
