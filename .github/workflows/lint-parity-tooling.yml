name: Lint SDK parity tooling

on:
  push:
    paths:
      - .github/workflows/lint-parity-tooling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add parity scripts to lint surface
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts.lint = 'eslint ./src ./scripts/parity';
          fs.writeFileSync(packagePath, JSON.stringify(packageJson, null, 2) + '\n');

          const configPath = 'eslint.config.cjs';
          let config = fs.readFileSync(configPath, 'utf8');
          const marker = "files: ['scripts/parity/**/*.ts']";
          if (!config.includes(marker)) {
            const block = `  {
            files: ['scripts/parity/**/*.ts'],
            languageOptions: {
              parser: tsparser,
              parserOptions: {
                ecmaVersion: 2022,
                sourceType: 'module',
                project: ['./tsconfig.parity.json'],
                tsconfigRootDir: __dirname,
              },
              globals: globals.node,
            },
            plugins: {
              '@typescript-eslint': tseslint,
            },
            rules: {
              ...eslint.configs.recommended.rules,
              ...tseslint.configs['recommended-type-checked'].rules,
              '@typescript-eslint/no-explicit-any': 'error',
              '@typescript-eslint/explicit-function-return-type': 'off',
              '@typescript-eslint/no-unused-vars': ['error', { argsIgnorePattern: '^_' }],
              'no-tabs': 'error',
              'prefer-const': 'error',
              eqeqeq: ['error', 'always'],
            },
          },
          `;
            const closing = '];\n';
            if (!config.endsWith(closing)) throw new Error('Unexpected eslint config ending');
            config = config.slice(0, -closing.length) + block + closing;
            fs.writeFileSync(configPath, config);
          }
          NODE

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/lint-parity-tooling.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/lint-parity-tooling.yml package.json eslint.config.cjs
          if git diff --cached --quiet; then
            echo "SDK parity tooling is already in the strict lint surface."
            exit 0
          fi
          git commit -m "chore: lint SDK parity tooling strictly"
          git pull --rebase origin main
          git push
