name: Fix event schema export cast

on:
  push:
    paths:
      - .github/workflows/fix-event-schema-cast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply narrow TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/parity/check-event-wire-parity.ts')
          text = path.read_text()
          text = text.replace(
              'const exports = sdk as Record<string, unknown>;',
              'const exports = sdk as unknown as Record<string, unknown>;',
          )
          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-event-schema-cast.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/fix-event-schema-cast.yml scripts/parity/check-event-wire-parity.ts
          if git diff --cached --quiet; then
            echo "Event schema export cast is already type-safe."
            exit 0
          fi
          git commit -m "fix: keep event schema export lookup type-safe"
          git pull --rebase origin main
          git push
