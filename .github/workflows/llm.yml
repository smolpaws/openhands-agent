name: Live LLM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-llm
  cancel-in-progress: false

jobs:
  deepseek:
    name: DeepSeek v4 Flash
    if: github.repository == 'smolpaws/openhands-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: LLM
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:live
      - name: Run real-provider regression
        run: npx tsx --test scripts/live/deepseek-flash.ts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
