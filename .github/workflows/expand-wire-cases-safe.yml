name: Expand deterministic message wire cases

on:
  push:
    paths:
      - .github/workflows/expand-wire-cases-safe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add low-ambiguity message cases
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'transpile/wire/cases.json';
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byId = new Map(document.cases.map((entry) => [entry.id, entry]));
          const additions = [
            {
              id: 'message-system-text',
              kind: 'message',
              input: {
                role: 'system',
                content: [{ type: 'text', text: 'system instruction' }],
              },
            },
            {
              id: 'message-user-multipart-text',
              kind: 'message',
              input: {
                role: 'user',
                content: [
                  { type: 'text', text: 'first part' },
                  { type: 'text', text: 'second part' },
                ],
              },
            },
            {
              id: 'message-assistant-null-content',
              kind: 'message',
              input: {
                role: 'assistant',
                content: null,
              },
            },
          ];
          for (const entry of additions) {
            if (!byId.has(entry.id)) document.cases.push(entry);
          }
          document.cases.sort((left, right) => left.id.localeCompare(right.id));
          fs.writeFileSync(path, JSON.stringify(document, null, 2) + '\n');
          NODE

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/expand-wire-cases-safe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/expand-wire-cases-safe.yml transpile/wire/cases.json
          if git diff --cached --quiet; then
            echo "Safe message wire cases are already present."
            exit 0
          fi
          git commit -m "test: expand deterministic message wire cases"
          git pull --rebase origin main
          git push
