name: Harden SDK wire workflows

on:
  push:
    paths:
      - .github/workflows/harden-sdk-wire-workflows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install self-validating workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          refresh = '''name: Refresh pinned Python SDK wire oracle

          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - .github/workflows/refresh-python-wire-oracle.yml
                - scripts/parity/generate-python-wire-oracle.py
                - scripts/parity/check-wire-parity.ts
                - transpile/upstream.json
                - transpile/wire/cases.json
                - tsconfig.parity.json

          permissions:
            contents: write

          concurrency:
            group: sdk-wire-oracle
            cancel-in-progress: true

          jobs:
            refresh:
              runs-on: ubuntu-latest
              timeout-minutes: 30

              steps:
                - name: Checkout TypeScript transpile
                  uses: actions/checkout@v4
                  with:
                    path: transpile

                - name: Read canonical upstream pin
                  id: pin
                  working-directory: transpile
                  run: |
                    pin="$(node -p "require('./transpile/upstream.json').commit")"
                    if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid canonical upstream pin: $pin" >&2
                      exit 1
                    fi
                    echo "sha=$pin" >> "$GITHUB_OUTPUT"

                - name: Checkout pinned OpenHands source
                  uses: actions/checkout@v4
                  with:
                    repository: OpenHands/software-agent-sdk
                    ref: @@ steps.pin.outputs.sha }}
                    fetch-depth: 1
                    path: upstream

                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: transpile/package-lock.json

                - name: Install uv and TypeScript dependencies
                  run: |
                    python -m pip install --disable-pip-version-check uv
                    npm ci --prefix transpile

                - name: Generate Python message oracle
                  working-directory: upstream
                  env:
                    OPENHANDS_UPSTREAM_COMMIT: @@ steps.pin.outputs.sha }}
                  run: |
                    uv run --package openhands-sdk python \
                      "$GITHUB_WORKSPACE/transpile/scripts/parity/generate-python-wire-oracle.py" \
                      --cases "$GITHUB_WORKSPACE/transpile/transpile/wire/cases.json" \
                      --output "$GITHUB_WORKSPACE/transpile/transpile/wire/python-oracle.json"

                - name: Typecheck parity tooling
                  working-directory: transpile
                  run: npx tsc -p tsconfig.parity.json

                - name: Compare generated Python oracle with TypeScript
                  id: parity
                  continue-on-error: true
                  working-directory: transpile
                  run: |
                    mkdir -p .wire
                    npx tsx scripts/parity/check-wire-parity.ts --report .wire/report.json

                - name: Publish parity report
                  if: always()
                  working-directory: transpile
                  run: |
                    if [ -f .wire/report.json ]; then
                      echo '## SDK wire parity' >> "$GITHUB_STEP_SUMMARY"
                      echo '```json' >> "$GITHUB_STEP_SUMMARY"
                      cat .wire/report.json >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                    fi

                - name: Upload parity report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: generated-sdk-wire-parity
                    path: transpile/.wire/report.json
                    if-no-files-found: warn
                    retention-days: 30

                - name: Reject mismatching oracle
                  if: steps.parity.outcome != 'success'
                  run: exit 1

                - name: Commit changed oracle
                  working-directory: transpile
                  run: |
                    oracle=transpile/wire/python-oracle.json
                    git add "$oracle"
                    if git diff --cached --quiet; then
                      echo "Pinned Python wire oracle is already current."
                      exit 0
                    fi
                    git config user.name github-actions[bot]
                    git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                    git commit -m "chore: refresh pinned Python SDK wire oracle"
                    git pull --rebase origin main
                    git push
          '''

          parity = '''name: SDK wire parity

          on:
            pull_request:
              branches: [main]
              paths:
                - .github/workflows/sdk-wire-parity.yml
                - scripts/parity/**
                - src/llm/**
                - src/index.ts
                - transpile/upstream.json
                - transpile/wire/**
                - tsconfig.parity.json
            push:
              branches: [main]
              paths:
                - .github/workflows/sdk-wire-parity.yml
                - scripts/parity/**
                - src/llm/**
                - src/index.ts
                - transpile/upstream.json
                - transpile/wire/**
                - tsconfig.parity.json

          jobs:
            parity:
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Require pinned Python oracle
                  run: test -f transpile/wire/python-oracle.json

                - name: Typecheck parity tooling
                  run: npx tsc -p tsconfig.parity.json

                - name: Compare message wire JSON
                  id: parity
                  continue-on-error: true
                  run: |
                    mkdir -p .wire
                    npx tsx scripts/parity/check-wire-parity.ts --report .wire/report.json

                - name: Publish parity report
                  if: always()
                  run: |
                    if [ -f .wire/report.json ]; then
                      echo '## SDK wire parity' >> "$GITHUB_STEP_SUMMARY"
                      echo '```json' >> "$GITHUB_STEP_SUMMARY"
                      cat .wire/report.json >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                    fi

                - name: Upload parity report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: sdk-wire-parity
                    path: .wire/report.json
                    if-no-files-found: warn
                    retention-days: 30

                - name: Fail on mismatch
                  if: steps.parity.outcome != 'success'
                  run: exit 1
          '''

          def write(path: str, template: str) -> None:
              content = template.replace('@@', '${{')
              lines = content.splitlines()
              indent = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
              Path(path).write_text('\n'.join(line[indent:] if line.strip() else '' for line in lines) + '\n')

          write('.github/workflows/refresh-python-wire-oracle.yml', refresh)
          write('.github/workflows/sdk-wire-parity.yml', parity)
          PY

          rm .github/workflows/harden-sdk-wire-workflows.yml

      - name: Commit workflow hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/harden-sdk-wire-workflows.yml \
            .github/workflows/refresh-python-wire-oracle.yml \
            .github/workflows/sdk-wire-parity.yml
          if git diff --cached --quiet; then
            echo "SDK wire workflows are already hardened."
            exit 0
          fi
          git commit -m "ci: make SDK wire oracle refresh self-validating"
          git pull --rebase origin main
          git push
