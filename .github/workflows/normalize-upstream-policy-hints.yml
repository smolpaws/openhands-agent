name: Complete upstream policy path hints

on:
  push:
    paths:
      - .github/workflows/normalize-upstream-policy-hints.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Normalize policy hints
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'transpile/upstream.json';
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          document.policyHints = [
            {
              prefix: 'openhands-sdk/openhands/sdk/agent/acp_',
              target: 'sdk',
              policy: 'DEV-SDK-005',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/settings/acp_',
              target: 'sdk',
              policy: 'DEV-SDK-005',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/security/',
              target: 'sdk',
              policy: 'DEV-SDK-001',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/conversation/secret_registry.py',
              target: 'sdk',
              policy: 'DEV-SDK-003',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/secret/',
              target: 'sdk',
              policy: 'DEV-SDK-003',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/utils/pydantic_secrets.py',
              target: 'sdk',
              policy: 'DEV-SDK-003',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/plugin/',
              target: 'sdk',
              policy: 'EXC-SDK-001',
            },
            {
              prefix: 'openhands-sdk/openhands/sdk/marketplace/',
              target: 'sdk',
              policy: 'EXC-SDK-002',
            },
            {
              prefix: 'openhands-agent-server/openhands/agent_server/desktop_',
              target: 'server',
              policy: 'EXC-SERVER-002',
            },
            {
              prefix: 'openhands-agent-server/openhands/agent_server/vscode_',
              target: 'server',
              policy: 'EXC-SERVER-002',
            },
            {
              prefix: 'openhands-agent-server/openhands/agent_server/init_router.py',
              target: 'server',
              policy: 'DEV-SERVER-005',
            },
            {
              prefix: 'openhands-agent-server/openhands/agent_server/_secret',
              target: 'server',
              policy: 'DEV-SERVER-003',
            },
          ].sort((left, right) => {
            const target = left.target.localeCompare(right.target);
            return target !== 0 ? target : left.prefix.localeCompare(right.prefix);
          });
          fs.writeFileSync(path, JSON.stringify(document, null, 2) + '\n');
          NODE

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/normalize-upstream-policy-hints.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/normalize-upstream-policy-hints.yml transpile/upstream.json
          if git diff --cached --quiet; then
            echo "Upstream policy hints are already complete."
            exit 0
          fi
          git commit -m "chore: complete upstream policy path hints"
          git pull --rebase origin main
          git push
