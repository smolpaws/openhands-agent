name: Render first upstream review packet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-first-upstream-batch.yml
      - transpile/updates/first-batch.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Render generated review facts
        run: |
          test -s transpile/updates/first-batch.json
          node - <<'NODE'
          const fs = require('fs');
          const document = JSON.parse(fs.readFileSync('transpile/updates/first-batch.json', 'utf8'));
          const lines = [
            '# First bounded upstream review batch',
            '',
            `**From:** \`${document.from ?? '<unknown>'}\`  `,
            `**To:** \`${document.to ?? '<unknown>'}\``,
            '',
            '> Generated view. Edit semantic annotations in `first-batch.json`, then regenerate this page. Do not hand-maintain this Markdown.',
            '',
          ];

          const items = document.items && typeof document.items === 'object'
            ? Object.entries(document.items)
            : [];
          lines.push(`## Review units (${items.length})`, '');

          for (const [id, raw] of items) {
            const item = raw && typeof raw === 'object' ? raw : {};
            const commit = item.commit && typeof item.commit === 'object' ? item.commit : {};
            const subject = commit.subject ?? commit.message ?? item.subject ?? item.message ?? '';
            const target = item.target ?? inferTarget(id);
            const disposition = item.disposition ?? 'UNCLASSIFIED';
            lines.push(`### \`${id}\``, '');
            lines.push(`- **Target:** ${target}`);
            lines.push(`- **Disposition:** \`${disposition}\``);
            if (subject) lines.push(`- **Upstream:** ${String(subject).split('\n')[0]}`);

            const paths = collectPaths(item);
            if (paths.length > 0) {
              lines.push('- **Changed paths:**');
              for (const path of paths.slice(0, 40)) lines.push(`  - \`${path}\``);
              if (paths.length > 40) lines.push(`  - … ${paths.length - 40} more`);
            }

            const hints = collectStrings(item, ['policyHints', 'policies', 'hints']);
            if (hints.length > 0) lines.push(`- **Policy hints:** ${hints.map((hint) => `\`${hint}\``).join(', ')}`);
            if (item.reason) lines.push(`- **Reason:** ${item.reason}`);
            lines.push('');
          }

          function inferTarget(id) {
            if (id.endsWith(':sdk') || id.includes(':sdk:')) return 'sdk';
            if (id.endsWith(':server') || id.includes(':server:')) return 'server';
            return 'unknown';
          }

          function collectPaths(value) {
            const found = new Set();
            walk(value, '', (key, entry) => {
              if (typeof entry !== 'string') return;
              if (key.toLowerCase().includes('path') || key.toLowerCase().includes('file')) {
                if (entry.includes('/')) found.add(entry);
              }
            });
            return [...found].sort();
          }

          function collectStrings(value, keys) {
            const wanted = new Set(keys.map((key) => key.toLowerCase()));
            const found = new Set();
            walk(value, '', (key, entry) => {
              if (!wanted.has(key.toLowerCase())) return;
              if (typeof entry === 'string') found.add(entry);
              if (Array.isArray(entry)) {
                for (const item of entry) if (typeof item === 'string') found.add(item);
              }
            });
            return [...found].sort();
          }

          function walk(value, key, visit) {
            visit(key, value);
            if (Array.isArray(value)) {
              for (const entry of value) walk(entry, key, visit);
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [childKey, entry] of Object.entries(value)) walk(entry, childKey, visit);
          }

          fs.writeFileSync('transpile/updates/first-batch.md', lines.join('\n') + '\n');
          NODE

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/render-first-upstream-batch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/render-first-upstream-batch.yml transpile/updates/first-batch.md
          if git diff --cached --quiet; then
            echo "First upstream review packet is already rendered."
            exit 0
          fi
          git commit -m "chore: render first upstream review packet"
          git pull --rebase origin main
          git push
